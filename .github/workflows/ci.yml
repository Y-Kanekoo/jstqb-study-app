name: 品質検査

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7
      - name: pnpmを準備
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - name: Node.jsを準備
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: 依存関係を固定してインストール
        run: pnpm install --frozen-lockfile
      - name: 静的検査・単体テスト・契約テスト・Webビルド
        run: pnpm check
      - name: Webビルド成果物を保存
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: e2e
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7
      - name: pnpmを準備
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - name: Node.jsを準備
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: 依存関係を固定してインストール
        run: pnpm install --frozen-lockfile
      - name: Webビルド成果物を取得
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist
      - name: Chromiumを準備
        run: pnpm exec playwright install --with-deps chromium
      - name: Web E2Eとアクセシビリティ検査
        run: pnpm test:e2e
      - name: E2E診断結果を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ソースを履歴付きで取得
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: pnpmを準備
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - name: Node.jsを準備
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: 依存関係を固定してインストール
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 追跡ファイルの秘密情報を検査
        run: pnpm check:secrets
      - name: 脆弱性監査例外の期限を検査
        run: pnpm check:security-exceptions
      - name: 本番依存関係の重大脆弱性を検査
        run: pnpm audit:prod
