name: 品質検査

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
      - name: pnpmを準備
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile
      - name: 禁止型を検査
        run: pnpm check:any
      - name: lint
        run: pnpm lint
      - name: 型検査
        run: pnpm typecheck
      - name: 単体テスト
        run: pnpm test
      - name: Webビルド
        run: pnpm build:web
