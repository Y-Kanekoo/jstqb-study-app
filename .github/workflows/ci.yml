name: 品質検査

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: pnpmを準備
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - name: Node.jsを準備
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: 依存関係を固定してインストール
        run: pnpm install --frozen-lockfile
      - name: 静的検査・単体テスト・契約テスト・Webビルド
        run: pnpm check
      - name: Webビルド成果物を保存
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: e2e
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: ソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: pnpmを準備
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - name: Node.jsを準備
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: 依存関係を固定してインストール
        run: pnpm install --frozen-lockfile
      - name: Webビルド成果物を取得
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-dist
          path: dist
      - name: Chromiumを準備
        run: pnpm exec playwright install --with-deps chromium
      - name: Web E2Eとアクセシビリティ検査
        run: pnpm test:e2e
      - name: E2E診断結果を保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  pages:
    name: pages
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_PATH: /${{ github.event.repository.name }}
      EXPO_PUBLIC_BASE_URL: /${{ github.event.repository.name }}
    steps:
      - name: ソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: pnpmを準備
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - name: Node.jsを準備
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: 依存関係を固定してインストール
        run: pnpm install --frozen-lockfile
      - name: Pagesサブパス用Web成果物を作成
        run: pnpm build:web
      - name: SPAフォールバックとJekyll除外を作成
        run: pnpm prepare:pages
      - name: Pages成果物を静的検証
        run: pnpm check:pages
      - name: Chromiumを準備
        run: pnpm exec playwright install --with-deps chromium
      - name: PagesサブパスでWeb E2Eを実行
        run: pnpm test:e2e
      - name: Pages E2E診断結果を保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pages-playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Supabase CLIを準備
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.113.0
      - name: DockerとCLIを確認
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          supabase --version
      - name: ローカルSupabaseを起動
        run: supabase start
      - name: 全migrationを空DBへ再適用
        run: supabase db reset
      - name: RLS・関数・pgTAPを実DBで検証
        run: supabase test db
      - name: DB失敗時の診断ログを表示
        if: failure()
        shell: bash
        run: |
          echo "稼働中・停止済みのSupabaseコンテナを確認します。"
          docker ps --all --filter "name=supabase_" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
          echo "PostgreSQLの末尾300行を表示します。"
          docker logs --tail 300 supabase_db_jstqb-study-app 2>&1 || true
      - name: ローカルSupabaseを確実に停止
        if: always()
        shell: bash
        run: |
          set +e
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
            stop_status=$?
          else
            stop_status=0
          fi
          remaining_containers="$(docker ps --all --quiet --filter "name=supabase_" 2>/dev/null)"
          if [[ -n "${remaining_containers}" ]]; then
            echo "::error::Supabaseコンテナがcleanup後も残っています。"
            docker ps --all --filter "name=supabase_" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
            exit 1
          fi
          exit "${stop_status}"

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ソースを履歴付きで取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: pnpmを準備
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - name: Node.jsを準備
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: 依存関係を固定してインストール
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 追跡ファイルの秘密情報を検査
        run: pnpm check:secrets
      - name: 脆弱性監査例外の期限を検査
        run: pnpm check:security-exceptions
      - name: 実行・ビルド依存関係の重大脆弱性を検査
        run: pnpm audit:dependencies
