name: 品質検査

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: pnpmを準備
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - name: Node.jsを準備
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: 依存関係を固定してインストール
        run: pnpm install --frozen-lockfile
      - name: 静的検査・単体テスト・契約テスト・Webビルド
        run: pnpm check
      - name: Webビルド成果物を保存
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: e2e
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: ソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: pnpmを準備
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - name: Node.jsを準備
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: 依存関係を固定してインストール
        run: pnpm install --frozen-lockfile
      - name: Webビルド成果物を取得
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-dist
          path: dist
      - name: Chromiumを準備
        run: pnpm exec playwright install --with-deps chromium
      - name: Web E2Eとアクセシビリティ検査
        run: pnpm test:e2e
      - name: E2E診断結果を保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  pages:
    name: pages
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_PATH: /${{ github.event.repository.name }}
      EXPO_PUBLIC_BASE_URL: /${{ github.event.repository.name }}
    steps:
      - name: ソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: pnpmを準備
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - name: Node.jsを準備
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: 依存関係を固定してインストール
        run: pnpm install --frozen-lockfile
      - name: Pagesサブパス用Web成果物を作成
        run: pnpm build:web
      - name: SPAフォールバックとJekyll除外を作成
        run: pnpm prepare:pages
      - name: Pages成果物を静的検証
        run: pnpm check:pages
      - name: Chromiumを準備
        run: pnpm exec playwright install --with-deps chromium
      - name: PagesサブパスでWeb E2Eを実行
        run: pnpm test:e2e
      - name: Pages E2E診断結果を保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pages-playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Supabase CLIを準備
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.113.0
      - name: DockerとCLIを確認
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          supabase --version
      - name: Supabase同一projectの事前確認
        id: database-preflight
        shell: bash
        run: |
          set -euo pipefail
          project_label='com.supabase.cli.project=jstqb-study-app'
          ownership_file="${RUNNER_TEMP}/supabase-owned-containers"
          existing_status=0
          existing_ids="$(docker ps --all --filter "label=${project_label}" --format '{{.ID}}')" || existing_status=$?
          if [[ "${existing_status}" -ne 0 ]]; then
            echo "::error::${project_label}の事前確認に失敗したため、DB操作を中止します。"
            exit "${existing_status}"
          fi
          if [[ -n "${existing_ids}" ]]; then
            echo "::error::${project_label}の既存containerを検出したため、他agentのDBを操作せず中止します。"
            docker ps --all --filter "label=${project_label}" --format 'table {{.ID}}\t{{.Names}}\t{{.Status}}'
            exit 1
          fi
          {
            echo 'known=false'
          } > "${ownership_file}"
      - name: ローカルSupabaseを起動
        id: database-start
        shell: bash
        run: |
          set -euo pipefail
          project_label='com.supabase.cli.project=jstqb-study-app'
          ownership_file="${RUNNER_TEMP}/supabase-owned-containers"
          log_file="${RUNNER_TEMP}/supabase-start.log"
          redact_log() {
            sed -E \
              -e 's#(://)[^[:space:]]+#\1[機密接続情報を伏せました]#g' \
              -e 's/[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{16,}/[JWTを伏せました]/g' \
              -e 's/[A-Za-z0-9_-]{24,}/[長いtoken候補を伏せました]/g' \
              -e 's/\b(password|token|secret|key|credential)\b[[:space:]]*[:=][[:space:]]*[^[:space:]]+/\1=[機密値を伏せました]/gi'
          }
          set +e
          supabase start > "${log_file}" 2>&1
          start_status=$?
          owned_names_status=0
          owned_names="$(docker ps --all --filter "label=${project_label}" --format '{{.Names}}')" || owned_names_status=$?
          set -e
          if [[ "${owned_names_status}" -eq 0 ]]; then
            echo 'known=true' > "${ownership_file}"
            while IFS= read -r container_name; do
              [[ -z "${container_name}" ]] || echo "name=${container_name}" >> "${ownership_file}"
            done <<< "${owned_names}"
          fi
          if [[ "${start_status}" -ne 0 ]]; then
            echo "::error::supabase startに失敗しました。"
            redact_log < "${log_file}"
            exit "${start_status}"
          fi
          if [[ "${owned_names_status}" -ne 0 || -z "${owned_names}" ]]; then
            echo "::error::起動後の${project_label}所有確認に失敗したため、中止します。"
            exit 1
          fi
      - name: 全migrationを空DBへ再適用
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/supabase-reset.log"
          set +e
          supabase db reset > "${log_file}" 2>&1
          command_status=$?
          set -e
          if [[ "${command_status}" -ne 0 ]]; then
            echo "::error::supabase db resetに失敗しました。"
            sed -E \
              -e 's#(://)[^[:space:]]+#\1[機密接続情報を伏せました]#g' \
              -e 's/[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{16,}/[JWTを伏せました]/g' \
              -e 's/[A-Za-z0-9_-]{24,}/[長いtoken候補を伏せました]/g' \
              -e 's/\b(password|token|secret|key|credential)\b[[:space:]]*[:=][[:space:]]*[^[:space:]]+/\1=[機密値を伏せました]/gi' < "${log_file}"
            exit "${command_status}"
          fi
      - name: RLS・関数・pgTAPを実DBで検証
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/supabase-test.log"
          set +e
          supabase test db > "${log_file}" 2>&1
          command_status=$?
          set -e
          if [[ "${command_status}" -ne 0 ]]; then
            echo "::error::supabase test dbに失敗しました。"
            sed -E \
              -e 's#(://)[^[:space:]]+#\1[機密接続情報を伏せました]#g' \
              -e 's/[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{16,}/[JWTを伏せました]/g' \
              -e 's/[A-Za-z0-9_-]{24,}/[長いtoken候補を伏せました]/g' \
              -e 's/\b(password|token|secret|key|credential)\b[[:space:]]*[:=][[:space:]]*[^[:space:]]+/\1=[機密値を伏せました]/gi' < "${log_file}"
            exit "${command_status}"
          fi
      - name: DB失敗時の診断ログを表示
        if: failure() && steps.database-preflight.outcome == 'success'
        shell: bash
        run: |
          set +e
          project_label='com.supabase.cli.project=jstqb-study-app'
          echo "稼働中・停止済みのSupabaseコンテナを確認します。"
          docker ps --all --filter "label=${project_label}" --format "table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Image}}"
          echo "PostgreSQLの末尾300行を表示します。"
          database_names_status=0
          database_names="$(docker ps --all --filter "label=${project_label}" --format '{{.Names}}')" || database_names_status=$?
          if [[ "${database_names_status}" -eq 0 ]] && grep -Fxq 'supabase_db_jstqb-study-app' <<< "${database_names}"; then
            docker logs --tail 300 supabase_db_jstqb-study-app 2>&1 \
              | sed -E \
                -e 's#(://)[^[:space:]]+#\1[機密接続情報を伏せました]#g' \
                -e 's/[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{16,}/[JWTを伏せました]/g' \
                -e 's/[A-Za-z0-9_-]{24,}/[長いtoken候補を伏せました]/g' \
                -e 's/\b(password|token|secret|key|credential)\b[[:space:]]*[:=][[:space:]]*[^[:space:]]+/\1=[機密値を伏せました]/gi' \
              || true
          fi
      - name: ローカルSupabaseを確実に停止
        if: always() && steps.database-preflight.outcome == 'success'
        shell: bash
        run: |
          set +e
          project_label='com.supabase.cli.project=jstqb-study-app'
          ownership_file="${RUNNER_TEMP}/supabase-owned-containers"
          if [[ ! -f "${ownership_file}" ]] || ! grep -q '^known=true$' "${ownership_file}"; then
            echo "::error::Supabaseの所有状態を確認できないため、他agentのDBを停止せずcleanupを中止します。"
            exit 1
          fi
          current_status=0
          current_names="$(docker ps --all --filter "label=${project_label}" --format '{{.Names}}')" || current_status=$?
          if [[ "${current_status}" -ne 0 ]]; then
            echo "::error::cleanup前の${project_label}所有確認に失敗したため、停止を中止します。"
            exit "${current_status}"
          fi
          owned_names="$(sed -n 's/^name=//p' "${ownership_file}")"
          unknown_names=""
          while IFS= read -r container_name; do
            [[ -z "${container_name}" ]] && continue
            if ! grep -Fxq "${container_name}" <<< "${owned_names}"; then
              unknown_names+="${container_name}\n"
            fi
          done <<< "${current_names}"
          if [[ -n "${unknown_names}" ]]; then
            echo "::error::未知の同project containerを検出したため、他agentのDBを停止せずcleanupを中止します。"
            exit 1
          fi
          if [[ -n "${current_names}" ]]; then
            stop_log="${RUNNER_TEMP}/supabase-stop.log"
            supabase stop --no-backup > "${stop_log}" 2>&1
            stop_status=$?
            if [[ "${stop_status}" -ne 0 ]]; then
              echo "::error::supabase stop --no-backupに失敗しました。"
              sed -E \
                -e 's#(://)[^[:space:]]+#\1[機密接続情報を伏せました]#g' \
                -e 's/[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{16,}/[JWTを伏せました]/g' \
                -e 's/[A-Za-z0-9_-]{24,}/[長いtoken候補を伏せました]/g' \
                -e 's/\b(password|token|secret|key|credential)\b[[:space:]]*[:=][[:space:]]*[^[:space:]]+/\1=[機密値を伏せました]/gi' < "${stop_log}"
              exit "${stop_status}"
            fi
          fi
          remaining_status=0
          remaining_containers="$(docker ps --all --quiet --filter "label=${project_label}")" || remaining_status=$?
          if [[ "${remaining_status}" -ne 0 ]]; then
            echo "::error::cleanup後の${project_label}残留確認に失敗しました。"
            exit "${remaining_status}"
          fi
          if [[ -n "${remaining_containers}" ]]; then
            echo "::error::cleanup後も${project_label}のcontainerが残っています。"
            docker ps --all --filter "label=${project_label}" --format "table {{.ID}}\t{{.Names}}\t{{.Status}}"
            exit 1
          fi

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ソースを履歴付きで取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: pnpmを準備
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - name: Node.jsを準備
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: 依存関係を固定してインストール
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 追跡ファイルの秘密情報を検査
        run: pnpm check:secrets
      - name: 脆弱性監査例外の期限を検査
        run: pnpm check:security-exceptions
      - name: 実行・ビルド依存関係の重大脆弱性を検査
        run: pnpm audit:dependencies
