name: データベース完全性検査

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ソースを取得
        uses: actions/checkout@v5
      - name: pnpmを準備
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - name: Node.jsを準備
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Supabase CLIを準備
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile
      - name: Supabaseを起動
        run: supabase start > /tmp/jstqb-supabase-start.log 2>&1
      - name: clean resetを実行
        run: supabase db reset --local --no-seed > /tmp/jstqb-supabase-reset.log 2>&1
      - name: pgTAPを実行
        run: supabase test db
      - name: upgrade harnessを実行
        run: node scripts/run-server-integrity-upgrade-harness.mjs
      - name: アプリ品質検査を実行
        run: pnpm check
