allowBuilds:
  unrs-resolver: false
overrides:
  # Only the reviewed xcode 3.0.1 CommonJS v4 consumer; see SDK security TDR.
  'xcode@3.0.1>uuid': 11.1.1
  # ESM/default and legacy plus semantics are adapted by the query-string patch.
  'query-string@7.1.3>decode-uri-component': 0.5.0
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.14'
  - '@expo/fingerprint@0.20.7'
  - '@expo/inline-modules@0.1.5'
  - '@expo/local-build-cache-provider@57.0.6'
  - '@expo/metro-config@57.0.8'
  - '@expo/metro-runtime@57.0.9'
  - '@expo/prebuild-config@57.0.11'
  - '@expo/ui@57.0.10'
  - expo-asset@57.0.10
  - expo-constants@57.0.10
  - expo-router@57.0.12
  - expo-server@57.0.2
  - expo-splash-screen@57.0.6
  - expo@57.0.12
verifyDepsBeforeRun: false
patchedDependencies:
  query-string@7.1.3: patches/query-string@7.1.3.patch
